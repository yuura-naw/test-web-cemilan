<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Cemilan Enak</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<header>

<h1>🍡 Cemilan Enak</h1>

<p>Cemilan pedas & manis favoritmu</p>

</header>



<main class="container">

<!-- CILOK -->

<div class="card">

<img src="img/cilok.jpg" alt="Cilok">

<h2>Cilok Pedas</h2>

<div class="rating">

⭐⭐⭐⭐⭐ <span>Terjual 150+</span>

</div>

<h3>Rp5.000</h3>

<div class="counter">

<button onclick="kurang('Cilok Pedas',5000)">−</button>

<span id="Cilok Pedas">0 pcs</span>

<button onclick="tambah('Cilok Pedas',5000)">+</button>

</div>

</div>





<!-- TIRAMISU -->

<div class="card">

<img src="img/tiramisu.jpg" alt="Tiramisu">

<h2>Keripik Pisang Tiramisu</h2>

<div class="rating">

⭐⭐⭐⭐⭐ <span>Terjual 90+</span>

</div>

<h3>Rp5.000</h3>

<div class="counter">

<button onclick="kurang('Keripik Pisang Tiramisu',5000)">−</button>

<span id="Keripik Pisang Tiramisu">0 pcs</span>

<button onclick="tambah('Keripik Pisang Tiramisu',5000)">+</button>

</div>

</div>





<!-- COKLAT -->

<div class="card">

<img src="img/coklat.jpg" alt="Coklat">

<h2>Keripik Pisang Coklat</h2>

<div class="rating">

⭐⭐⭐⭐⭐ <span>Terjual 120+</span>

</div>

<h3>Rp5.000</h3>

<div class="counter">

<button onclick="kurang('Keripik Pisang Coklat',5000)">−</button>

<span id="Keripik Pisang Coklat">0 pcs</span>

<button onclick="tambah('Keripik Pisang Coklat',5000)">+</button>

</div>

</div>





<!-- MATCHA -->

<div class="card">

<img src="img/matcha.jpg" alt="Matcha">

<h2>Keripik Pisang Matcha</h2>

<div class="rating">

⭐⭐⭐⭐⭐ <span>Terjual 70+</span>

</div>

<h3>Rp5.000</h3>

<div class="counter">

<button onclick="kurang('Keripik Pisang Matcha',5000)">−</button>

<span id="Keripik Pisang Matcha">0 pcs</span>

<button onclick="tambah('Keripik Pisang Matcha',5000)">+</button>

</div>

</div>

</main>





<div class="checkout">

<input

type="text"

id="namaPembeli"

placeholder="👤 Masukkan nama pembeli">



<div class="total-box">

<div>Total Harga</div>

<b>Rp<span id="total">0</span></b>

</div>



<button onclick="checkout()">

🛒 Checkout WhatsApp

</button>

</div>



<script src="script.js"></script>

</body>

                 </html>
