<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Cemilan Enak</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<header>

<h1>🍡 Cemilan Enak</h1>

<p>Cemilan pedas & manis favoritmu</p>

</header>



<main class="container">

<!-- CILOK -->

<div class="card">

<img src="img/cilok.jpg" alt="Pentol Pedas">

<h2>Pentol Pedas</h2>

<div class="rating">

⭐⭐⭐⭐⭐ <span>Terjual 150+</span>

</div>

<h3>Rp5.000</h3>

<div class="counter">

<button onclick="kurang('pentol','Pentol Pedas',5000)">−</button>

<span id="pentol">0 pcs</span>

<button onclick="tambah('pentol','Pentol Pedas',5000)">+</button>

</div>

</div>





<!-- TIRAMISU -->

<div class="counter">

    <button onclick="kurang('tiramisu','Keripik Pisang Tiramisu',5000)">−</button>

    <span id="tiramisu">0 pcs</span>

    <button onclick="tambah('tiramisu','Keripik Pisang Tiramisu',5000)">+</button>

</div>





<!-- COKLAT -->

<div class="counter">

    <button onclick="kurang('coklat','Keripik Pisang Coklat',5000)">−</button>

    <span id="coklat">0 pcs</span>

    <button onclick="tambah('coklat','Keripik Pisang Coklat',5000)">+</button>

</div>





<!-- MATCHA -->

<div class="counter">

    <button onclick="kurang('matcha','Keripik Pisang Matcha',5000)">−</button>

    <span id="matcha">0 pcs</span>

    <button onclick="tambah('matcha','Keripik Pisang Matcha',5000)">+</button>

</div>

</main>





<div class="checkout">

<input

type="text"

id="namaPembeli"

placeholder="👤 Masukkan nama pembeli">



<div class="total-box">

<div>Total Harga</div>

<b>Rp<span id="total">0</span></b>

</div>



<button onclick="checkout()">

🛒 Checkout WhatsApp

</button>

</div>



<script src="script.js"></script>

</body>

                 </html>
